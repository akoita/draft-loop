version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # React refuses mismatched react and react-dom versions, so bump the
      # runtime and its type packages together.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
  # Workflow actions are pinned to commit SHAs with the release in a trailing
  # comment; Dependabot moves both together. The cooldown lets a release age
  # before it reaches CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
