name: Installed app acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-installed-app:
    name: ${{ matrix.name }} installed app acceptance
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            arch: x64
          - name: macos-arm64
            os: macos-14
            arch: arm64
          - name: windows-x64
            os: windows-latest
            arch: x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop application
        run: pnpm --filter @draft-loop/desktop package --arch ${{ matrix.arch }}

      - name: Locate packaged executable
        id: executable
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) path="$(find apps/desktop/out -type f -name '@draft-loop-desktop' -perm -u+x -print -quit)" ;;
            macOS) path="$(find apps/desktop/out -type f -path '*.app/Contents/MacOS/*' -print -quit)" ;;
            Windows) path="$(find apps/desktop/out -type f -name '@draft-loop-desktop.exe' -print -quit)" ;;
          esac
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Run sanitized installed-app acceptance
        shell: bash
        run: pnpm desktop:acceptance -- "${{ steps.executable.outputs.path }}" "acceptance-evidence/${{ matrix.name }}.json"

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v7
        with:
          name: installed-app-acceptance-${{ matrix.name }}
          path: acceptance-evidence/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 14
