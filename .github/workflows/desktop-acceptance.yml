name: Installed app acceptance

# Packages the desktop client (ADR 0011, D9) on each platform and drives it against a scripted
# fake API on the runner. The gate job is a required check on main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Desktop change scope
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.scope.outputs.desktop }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Decide whether the change reaches the packaged client
        id: scope
        run: node scripts/desktop-ci-scope.mjs >> "$GITHUB_OUTPUT"

  packaged-installed-app:
    name: ${{ matrix.name }} desktop client acceptance
    needs: scope
    if: needs.scope.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            arch: x64
          - name: macos-arm64
            os: macos-15
            arch: arm64
          - name: windows-x64
            os: windows-latest
            arch: x64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Xvfb and xauth (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth

      - name: Package the desktop client
        run: pnpm --filter @draft-loop/desktop-client package --arch ${{ matrix.arch }}

      - name: Locate packaged executable
        id: executable
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) path="$(find apps/desktop-client/out -type f -name 'draftloop' -perm -u+x -print -quit)" ;;
            macOS) path="$(find apps/desktop-client/out -type f -path '*.app/Contents/MacOS/*' -print -quit)" ;;
            Windows) path="$(find apps/desktop-client/out -type f -name 'draftloop.exe' -print -quit)" ;;
          esac
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Run packaged acceptance (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run --auto-servernum pnpm desktop-client:acceptance -- "${{ steps.executable.outputs.path }}" "acceptance-evidence/${{ matrix.name }}.json"

      - name: Run packaged acceptance (macOS and Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: pnpm desktop-client:acceptance -- "${{ steps.executable.outputs.path }}" "acceptance-evidence/${{ matrix.name }}.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-app-acceptance-${{ matrix.name }}
          path: acceptance-evidence/${{ matrix.name }}.json
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: Installed app acceptance gate
    needs: [scope, packaged-installed-app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every in-scope platform to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DESKTOP: ${{ needs.scope.outputs.desktop }}
          PLATFORM_RESULT: ${{ needs.packaged-installed-app.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$DESKTOP" = true ]; then
            test "$PLATFORM_RESULT" = success
          else
            echo "The change cannot reach the packaged desktop client; acceptance skipped."
          fi
