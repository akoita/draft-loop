name: Live provider E2E

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref or commit SHA to validate; defaults to the triggering ref"
        required: false
        type: string
      author_model:
        description: "Overrides the gate's default author model id; leave empty to use the default"
        required: false
        type: string
      critic_model:
        description: "Overrides the gate's default critic model id; leave empty to use the default"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      author_model:
        description: "Overrides the gate's default author model id; leave empty to use the default"
        required: false
        type: string
      critic_model:
        description: "Overrides the gate's default critic model id; leave empty to use the default"
        required: false
        type: string

permissions:
  contents: read

jobs:
  live-provider-e2e:
    name: Live provider E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop application
        run: pnpm --filter @draft-loop/desktop package --arch x64

      - name: Locate packaged executable
        id: executable
        shell: bash
        run: |
          path="$(find apps/desktop/out -type f -name '@draft-loop-desktop' -perm -u+x -print -quit)"
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Verify provider credentials are configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY and OPENAI_API_KEY repository secrets must both be configured for the live provider E2E gate."
            exit 1
          fi

      - name: Run live provider E2E gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRAFT_LOOP_LIVE_E2E_AUTHOR_MODEL: ${{ inputs.author_model }}
          DRAFT_LOOP_LIVE_E2E_CRITIC_MODEL: ${{ inputs.critic_model }}
        run: pnpm test:e2e:live -- "${{ steps.executable.outputs.path }}" "live-evidence/linux-x64.json"

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v7
        with:
          name: live-provider-e2e-linux-x64
          path: live-evidence/linux-x64.json
          if-no-files-found: error
          retention-days: 14
