name: Server images

# Publishes the self-hosted stack's images (ADR 0011, D15) for each server tag:
# ghcr.io/akoita/draft-loop-<app>:<version>, where a tag server-v0.12.0 gives the version 0.12.0.
# The images hold code and the pinned embedding model only, never data, keys or settings. The
# workflow signs in with its own short-lived token; no stored credential is used.
on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing server tag to publish, such as server-v0.11.0"
        required: true

permissions:
  contents: read

concurrency:
  group: server-images-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, page-fetcher]
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^server-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$TAG is not a server tag such as server-v0.12.0"
            exit 1
          fi
          echo "VERSION=${TAG#server-v}" >> "$GITHUB_ENV"
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Record the commit
        run: echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Set up QEMU for the arm64 image
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/akoita/draft-loop-${{ matrix.app }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/akoita/draft-loop
            org.opencontainers.image.title=draft-loop-${{ matrix.app }}
            org.opencontainers.image.description=DraftLoop's self-hosted ${{ matrix.app }} image
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.REVISION }}
