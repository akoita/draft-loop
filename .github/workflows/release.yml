name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release; must match the root package.json"
        required: true
        type: string
      dry_run:
        description: "Build and validate the release without publishing a GitHub Release"
        required: true
        default: true
        type: boolean
      attest_provenance:
        description: "Generate GitHub artifact provenance attestations when the repository plan supports them"
        required: true
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
      stage: ${{ steps.metadata.outputs.stage }}
      channel: ${{ steps.metadata.outputs.channel }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      stage_issue: ${{ steps.metadata.outputs.stage_issue }}
    steps:
      - name: Check out approved main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version and release policy
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$RELEASE_VERSION" = "$(node -p "require('./package.json').version")"
          pnpm release:check

      - name: Pin approved revision
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read release metadata
        id: metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const metadata = JSON.parse(fs.readFileSync("release.json", "utf8"));
          for (const [key, value] of Object.entries({
            stage: metadata.stage,
            channel: metadata.channel,
            release_name: metadata.releaseName,
            stage_issue: String(metadata.stageIssue),
          })) {
            if (typeof value !== "string" || value.length === 0 || value.includes("\n")) {
              throw new Error(`Invalid release metadata output for ${key}.`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          NODE

      - name: Run repository quality gates
        run: pnpm validate

  build:
    name: Build ${{ matrix.name }} desktop artifact
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            arch: x64
          - name: macos-arm64
            os: macos-latest
            arch: arm64
          - name: windows-x64
            os: windows-latest
            arch: x64
    steps:
      - name: Check out approved main
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update apt package indexes (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Install Xvfb and xauth (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install --no-install-recommends -y xvfb xauth

      - name: Build packaged desktop application
        run: pnpm --filter @draft-loop/desktop make --arch ${{ matrix.arch }}

      - name: Locate packaged executable
        id: executable
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) path="$(find apps/desktop/out -type f -name '@draft-loop-desktop' -perm -u+x -print -quit)" ;;
            macOS) path="$(find apps/desktop/out -type f -path '*.app/Contents/MacOS/*' -print -quit)" ;;
            Windows) path="$(find apps/desktop/out -type f -name '@draft-loop-desktop.exe' -print -quit)" ;;
          esac
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Run packaged desktop smoke
        if: ${{ matrix.name == 'linux-x64' }}
        run: xvfb-run --auto-servernum pnpm desktop:smoke -- "${{ steps.executable.outputs.path }}"

      - name: Run installed-app and credential acceptance (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run --auto-servernum pnpm desktop:acceptance -- "${{ steps.executable.outputs.path }}" "release-evidence/installed-app-${{ matrix.name }}.json"
          xvfb-run --auto-servernum pnpm desktop:credential-acceptance -- "${{ steps.executable.outputs.path }}" "release-evidence/credential-${{ matrix.name }}.json"

      - name: Run installed-app and credential acceptance (macOS and Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          pnpm desktop:acceptance -- "${{ steps.executable.outputs.path }}" "release-evidence/installed-app-${{ matrix.name }}.json"
          pnpm desktop:credential-acceptance -- "${{ steps.executable.outputs.path }}" "release-evidence/credential-${{ matrix.name }}.json"

      - name: Upload sanitized acceptance evidence
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-evidence-${{ matrix.name }}
          path: release-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: apps/desktop/out/make
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create release manifest and publish
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_STAGE: ${{ needs.validate.outputs.stage }}
      RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
      RELEASE_NAME: ${{ needs.validate.outputs.release_name }}
      RELEASE_STAGE_ISSUE: ${{ needs.validate.outputs.stage_issue }}
      DRY_RUN: ${{ inputs.dry_run }}
      ATTEST_PROVENANCE: ${{ inputs.attest_provenance }}
    steps:
      - name: Check out approved main
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare release output directory
        run: mkdir -p release-output

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: release-output/draft-loop-${{ env.RELEASE_VERSION }}.cdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate artifact provenance attestations
        if: ${{ !inputs.dry_run && inputs.attest_provenance }}
        uses: actions/attest@v4
        with:
          subject-path: release-artifacts/**

      - name: Create checksums
        run: |
          mkdir -p release-output
          find release-artifacts -type f -print0 | sort -z | xargs -0 sha256sum > release-output/SHA256SUMS

      - name: Generate release manifest
        run: |
          mkdir -p release-output
          commit="$(git rev-parse HEAD)"
          if [[ "$DRY_RUN" == "true" ]]; then
            node scripts/release.mjs manifest --dry-run --commit "$commit" --artifacts-dir release-artifacts > release-output/release-manifest.json
          else
            node scripts/release.mjs manifest --output release-output/release-manifest.json --commit "$commit" --artifacts-dir release-artifacts
          fi
          node -e 'const manifest = require("./release-output/release-manifest.json"); if (manifest.version !== process.env.RELEASE_VERSION) throw new Error(`Manifest version ${manifest.version} does not match ${process.env.RELEASE_VERSION}.`);'
          cat release-output/release-manifest.json

      - name: Prepare release notes
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const repository = process.env.GITHUB_REPOSITORY;
          const notes = [
            `Roadmap stage: ${process.env.RELEASE_STAGE}`,
            `Channel: ${process.env.RELEASE_CHANNEL}`,
            `Source commit: ${process.env.RELEASE_COMMIT}`,
            "",
            `Validation: https://github.com/${repository}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            `Stage issue: https://github.com/${repository}/issues/${process.env.RELEASE_STAGE_ISSUE}`,
            "SBOM: CycloneDX JSON is attached to the release.",
            "Local-first CV quality checkpoint: this alpha checkpoint precedes the Local-first final: CV quality parity stage exit and claims no parity or outcome validation. Since v0.8.0-alpha.3 it carries seven completed stages: local semantic retrieval, inputs and setup clarity, development model providers, any-format career intake, candidate home and applications, tailored, sendable CVs, and the simple guided workflow, whose exit was met in a fixture walk. A workspace is the candidate's home: one reviewed career profile serves many applications, each with its own requirements, runs, exports and optional model pair. Career evidence in any format is structured into one reviewed profile whose facts carry exact source quotes. Each application is three steps, a checklist beside Start explains every blocker, and Start waits for a reviewed requirements brief, which can now name a missing employer. The CV quality work drafts an application plan first, writes to a chosen one- or two-page target, takes candidate directions between rounds, applies accepted findings as targeted patches, adds a strategic critic, stops when author and critic agree, and pauses and resumes on a subscription usage limit. Two runs can be compared side by side and the better draft kept. Exports are sendable DOCX and PDF with the candidate's layout, printed through the browser engine, with Classic, Compact and Modern templates; Modern is the default. The review screen adds a Job tab, one footer stage at a time and a scrollable findings list. Run history no longer stores every snapshot in full, and existing workspaces can compact their history with a backup. Storage now sits behind ports for the future hosted version; the desktop and CLI behavior is unchanged.",
            ...(process.env.ATTEST_PROVENANCE === "true"
              ? ["Provenance: GitHub artifact attestations were requested for packaged artifacts."]
              : ["Provenance: not requested for this run."]),
            "",
            "Known limitations: representative consented CV quality and manual-parity outcomes remain unvalidated; the parity baseline on references A to E is not yet scored on this revision (#1307), and the stage exit is not met. Templates derived from a CV the person likes are not available yet (#1331). The provider sign-in check in the start checklist is advisory. DOCX checks cannot establish office pagination or clipping, broad cross-viewer validation remains outstanding, signing and automatic updates remain incomplete, and the CLI remains source-distributed. Codex user-session and local routes do not support profile controls.",
          ].join("\n");
          fs.writeFileSync("release-output/release-notes.md", `${notes}\n`, "utf8");
          NODE

      - name: Upload dry-run manifest
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-${{ inputs.version }}
          path: |
            release-output/release-manifest.json
            release-output/SHA256SUMS
            release-output/release-notes.md
            release-output/draft-loop-${{ inputs.version }}.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-artifacts -type f ! -name 'SHA256SUMS' -print | sort)
          assets+=(release-output/SHA256SUMS release-output/release-manifest.json "release-output/draft-loop-${RELEASE_VERSION}.cdx.json")
          release_args=(
            "v${RELEASE_VERSION}"
            "${assets[@]}"
            --target "${RELEASE_COMMIT}"
            --title "${RELEASE_NAME} v${RELEASE_VERSION}"
            --generate-notes
            --notes-file release-output/release-notes.md
          )
          if [[ "$RELEASE_CHANNEL" != "stable" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
