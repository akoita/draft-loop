name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release; must match the root package.json"
        required: true
        type: string
      dry_run:
        description: "Build and validate the release without publishing a GitHub Release"
        required: true
        default: true
        type: boolean
      attest_provenance:
        description: "Generate GitHub artifact provenance attestations when the repository plan supports them"
        required: true
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
      stage: ${{ steps.metadata.outputs.stage }}
      channel: ${{ steps.metadata.outputs.channel }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      stage_issue: ${{ steps.metadata.outputs.stage_issue }}
    steps:
      - name: Check out approved main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version and release policy
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$RELEASE_VERSION" = "$(node -p "require('./package.json').version")"
          pnpm release:check

      - name: Pin approved revision
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read release metadata
        id: metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const metadata = JSON.parse(fs.readFileSync("release.json", "utf8"));
          for (const [key, value] of Object.entries({
            stage: metadata.stage,
            channel: metadata.channel,
            release_name: metadata.releaseName,
            stage_issue: String(metadata.stageIssue),
          })) {
            if (typeof value !== "string" || value.length === 0 || value.includes("\n")) {
              throw new Error(`Invalid release metadata output for ${key}.`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          NODE

      - name: Run repository quality gates
        run: pnpm validate

  build:
    name: Build ${{ matrix.name }} desktop client artifact
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            arch: x64
          - name: macos-arm64
            os: macos-latest
            arch: arm64
          - name: windows-x64
            os: windows-latest
            arch: x64
    steps:
      - name: Check out approved main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update apt package indexes (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Install Xvfb and xauth (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install --no-install-recommends -y xvfb xauth

      - name: Build the packaged desktop client
        run: pnpm --filter @draft-loop/desktop-client make --arch ${{ matrix.arch }}

      - name: Locate packaged executable
        id: executable
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) path="$(find apps/desktop-client/out -type f -name 'draftloop' -perm -u+x -not -path '*/make/*' -print -quit)" ;;
            macOS) path="$(find apps/desktop-client/out -type f -path '*.app/Contents/MacOS/*' -not -path '*/make/*' -print -quit)" ;;
            Windows) path="$(find apps/desktop-client/out -type f -name 'draftloop.exe' -not -path '*/make/*' -print -quit)" ;;
          esac
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Run packaged desktop client acceptance (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run --auto-servernum pnpm desktop-client:acceptance -- "${{ steps.executable.outputs.path }}" "release-evidence/desktop-client-${{ matrix.name }}.json"

      - name: Run packaged desktop client acceptance (macOS and Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: pnpm desktop-client:acceptance -- "${{ steps.executable.outputs.path }}" "release-evidence/desktop-client-${{ matrix.name }}.json"

      - name: Upload sanitized acceptance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-evidence-${{ matrix.name }}
          path: release-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload platform artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: apps/desktop-client/out/make
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create release manifest and publish
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_STAGE: ${{ needs.validate.outputs.stage }}
      RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
      RELEASE_NAME: ${{ needs.validate.outputs.release_name }}
      RELEASE_STAGE_ISSUE: ${{ needs.validate.outputs.stage_issue }}
      DRY_RUN: ${{ inputs.dry_run }}
      ATTEST_PROVENANCE: ${{ inputs.attest_provenance }}
    steps:
      - name: Check out approved main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare release output directory
        run: mkdir -p release-output

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: release-output/draft-loop-${{ env.RELEASE_VERSION }}.cdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Download platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate artifact provenance attestations
        if: ${{ !inputs.dry_run && inputs.attest_provenance }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/**

      - name: Create checksums
        run: |
          mkdir -p release-output
          find release-artifacts -type f -print0 | sort -z | xargs -0 sha256sum > release-output/SHA256SUMS

      - name: Generate release manifest
        run: |
          mkdir -p release-output
          commit="$(git rev-parse HEAD)"
          if [[ "$DRY_RUN" == "true" ]]; then
            node scripts/release.mjs manifest --dry-run --commit "$commit" --artifacts-dir release-artifacts > release-output/release-manifest.json
          else
            node scripts/release.mjs manifest --output release-output/release-manifest.json --commit "$commit" --artifacts-dir release-artifacts
          fi
          node -e 'const manifest = require("./release-output/release-manifest.json"); if (manifest.version !== process.env.RELEASE_VERSION) throw new Error(`Manifest version ${manifest.version} does not match ${process.env.RELEASE_VERSION}.`);'
          cat release-output/release-manifest.json

      - name: Prepare release notes
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const repository = process.env.GITHUB_REPOSITORY;
          const notes = [
            `Roadmap stage: ${process.env.RELEASE_STAGE}`,
            `Channel: ${process.env.RELEASE_CHANNEL}`,
            `Source commit: ${process.env.RELEASE_COMMIT}`,
            "",
            `Validation: https://github.com/${repository}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            `Stage issue: https://github.com/${repository}/issues/${process.env.RELEASE_STAGE_ISSUE}`,
            "SBOM: CycloneDX JSON is attached to the release.",
            "Desktop client: from v0.9.0 the desktop app is a client of a DraftLoop server (ADR 0011, D9): an Electron window over the server's own web screen, for your self-hosted server and, once production opens, the hosted service. It holds no engine, storage or provider keys, so its screens update with the server. The v0.8 desktop with its own local engine is not in this release; move its workspaces to a self-hosted server with `draft-loop server import`.",
            ...(process.env.ATTEST_PROVENANCE === "true"
              ? ["Provenance: GitHub artifact attestations were requested for packaged artifacts."]
              : ["Provenance: not requested for this run."]),
            "",
            "Known limitations: the packages are not signed and do not update themselves; the client offers the releases page when a newer version is published. There is no offline drafting: the client needs its server. Sign-in mode is proven only once the hosted identity provider runs; owner-token mode is what this release covers. Representative consented CV quality remains unvalidated, and the #1309 stage exit is not met.",
          ].join("\n");
          fs.writeFileSync("release-output/release-notes.md", `${notes}\n`, "utf8");
          NODE

      - name: Upload dry-run manifest
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run-${{ inputs.version }}
          path: |
            release-output/release-manifest.json
            release-output/SHA256SUMS
            release-output/release-notes.md
            release-output/draft-loop-${{ inputs.version }}.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-artifacts -type f ! -name 'SHA256SUMS' -print | sort)
          assets+=(release-output/SHA256SUMS release-output/release-manifest.json "release-output/draft-loop-${RELEASE_VERSION}.cdx.json")
          release_args=(
            "v${RELEASE_VERSION}"
            "${assets[@]}"
            --target "${RELEASE_COMMIT}"
            --title "${RELEASE_NAME} v${RELEASE_VERSION}"
            --generate-notes
            --notes-file release-output/release-notes.md
          )
          if [[ "$RELEASE_CHANNEL" != "stable" ]]; then
            release_args+=(--prerelease)
          fi
          # Generated notes start at the previous desktop release, never at a server-v* tag:
          # GitHub's default pick can reach back far enough to pass the 125,000-character limit.
          previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | select(.draft | not) | select(.tag_name | test("^v[0-9]"))][0].tag_name // empty')"
          if [[ -n "$previous_tag" ]]; then
            release_args+=(--notes-start-tag "$previous_tag")
          fi
          gh release create "${release_args[@]}"
