name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.18.3
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  server-storage:
    name: Server storage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DRAFT_LOOP_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      DRAFT_LOOP_TEST_GCS_URL: http://localhost:4443
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.18.3
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # A service container cannot take arguments, and the emulator needs them to serve plain HTTP.
      - name: Start the Cloud Storage emulator
        run: |
          docker run --detach --name gcs-emulator --publish 4443:4443 \
            fsouza/fake-gcs-server:1.56.1 -scheme http -port 4443 -backend memory
          for attempt in $(seq 1 30); do
            curl --silent --fail "$DRAFT_LOOP_TEST_GCS_URL/storage/v1/b?project=ci" && exit 0
            sleep 1
          done
          docker logs gcs-emulator
          exit 1
      - name: Run the storage conformance and run queue suites against Postgres
        run: pnpm test:postgres
      - name: Run the blob conformance suite against the Cloud Storage emulator
        run: pnpm test:gcs
