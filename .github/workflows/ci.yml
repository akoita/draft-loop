name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Decides which jobs this change needs (scripts/ci-scope.mjs): tests run for the packages a
  # pull request touches and the packages that depend on them. Pushes to main run everything.
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      run_all: ${{ steps.scope.outputs.run_all }}
      tests: ${{ steps.scope.outputs.tests }}
      packages: ${{ steps.scope.outputs.packages }}
      shards: ${{ steps.scope.outputs.shards }}
      server_storage: ${{ steps.scope.outputs.server_storage }}
      self_hosted: ${{ steps.scope.outputs.self_hosted }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Test the change scope
        run: node --test scripts/ci-scope.test.mjs
      - name: Decide what the change reaches
        id: scope
        run: node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"

  static-checks:
    name: Static checks
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.18.3
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint the docs
        if: needs.scope.outputs.docs_only == 'true'
        run: pnpm lint:docs
      - name: Lint
        if: needs.scope.outputs.docs_only != 'true'
        run: pnpm lint
      - name: Check the screen catalogs
        if: needs.scope.outputs.docs_only != 'true'
        run: pnpm i18n:check
      - name: Typecheck
        if: needs.scope.outputs.docs_only != 'true'
        run: pnpm typecheck

  # A full run splits the suite across three runners; a scoped run uses one.
  tests:
    name: Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: scope
    if: needs.scope.outputs.tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.18.3
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test every package, one shard
        if: needs.scope.outputs.run_all == 'true'
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Test the affected packages
        if: needs.scope.outputs.run_all != 'true' && needs.scope.outputs.packages != ''
        env:
          PACKAGES: ${{ needs.scope.outputs.packages }}
        # Word splitting is intended: PACKAGES is a space-separated list of package folders.
        run: pnpm exec vitest run --passWithNoTests $PACKAGES
      - name: Test the release and CI tooling
        if: matrix.shard == 1
        run: pnpm test:release

  # The required check. It always reports, so a job skipped by scope never blocks a merge.
  validate:
    name: validate
    needs: [scope, static-checks, tests, server-storage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job the change needs to pass
        env:
          SCOPE: ${{ needs.scope.result }}
          STATIC: ${{ needs.static-checks.result }}
          TESTS: ${{ needs.tests.result }}
          TESTS_NEEDED: ${{ needs.scope.outputs.tests }}
          STORAGE: ${{ needs.server-storage.result }}
          STORAGE_NEEDED: ${{ needs.scope.outputs.server_storage }}
        run: |
          check() {
            if [ "$2" = true ]; then want=success; else want=skipped; fi
            if [ "$3" != "$want" ]; then
              echo "::error::$1 ended $3; this change needs it to be $want."
              exit 1
            fi
            echo "$1: $3"
          }
          check "Change scope" true "$SCOPE"
          check "Static checks" true "$STATIC"
          check "Tests" "$TESTS_NEEDED" "$TESTS"
          check "Server storage" "$STORAGE_NEEDED" "$STORAGE"

  server-storage:
    name: Server storage
    needs: scope
    if: needs.scope.outputs.server_storage == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DRAFT_LOOP_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      DRAFT_LOOP_TEST_GCS_URL: http://localhost:4443
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.18.3
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # A service container cannot take arguments, and the emulator needs them to serve plain HTTP.
      - name: Start the Cloud Storage emulator
        run: |
          docker run --detach --name gcs-emulator --publish 4443:4443 \
            fsouza/fake-gcs-server:1.56.1 -scheme http -port 4443 -backend memory
          for attempt in $(seq 1 30); do
            curl --silent --fail "$DRAFT_LOOP_TEST_GCS_URL/storage/v1/b?project=ci" && exit 0
            sleep 1
          done
          docker logs gcs-emulator
          exit 1
      - name: Run the storage conformance, run queue and worker suites against Postgres
        run: pnpm test:postgres
      - name: Run the blob conformance suite against the Cloud Storage emulator
        run: pnpm test:gcs

  # Not required yet (#2053): it becomes a required check once it has stayed green for a while.
  self-hosted-stack:
    name: Self-hosted stack
    needs: scope
    if: needs.scope.outputs.self_hosted == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.18.3
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Builds the three images from this commit, boots deploy/local with the worker on its offline
      # fixtures and runs the hosted smoke through the API, then removes the stack.
      - name: Boot the self-hosted stack and run a scripted run to a DOCX
        run: pnpm self-hosted:test
