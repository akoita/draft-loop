name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Decides which jobs this change needs (scripts/ci-scope.mjs): tests run for the packages a
  # pull request touches and the packages that depend on them. Pushes to main run everything.
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      run_all: ${{ steps.scope.outputs.run_all }}
      tests: ${{ steps.scope.outputs.tests }}
      packages: ${{ steps.scope.outputs.packages }}
      shards: ${{ steps.scope.outputs.shards }}
      server_storage: ${{ steps.scope.outputs.server_storage }}
      self_hosted: ${{ steps.scope.outputs.self_hosted }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Test the change scope
        run: node --test scripts/ci-scope.test.mjs
      - name: Decide what the change reaches
        id: scope
        run: node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"

  static-checks:
    name: Static checks
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.3
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint the docs
        if: needs.scope.outputs.docs_only == 'true'
        run: pnpm lint:docs
      - name: Lint
        if: needs.scope.outputs.docs_only != 'true'
        run: pnpm lint
      - name: Check the screen catalogs
        if: needs.scope.outputs.docs_only != 'true'
        run: pnpm i18n:check
      - name: Typecheck
        if: needs.scope.outputs.docs_only != 'true'
        run: pnpm typecheck
      # Every change can carry a secret, docs included.
      - name: Scan for secrets
        run: pnpm security:secrets
      - name: Check dependency licenses
        if: needs.scope.outputs.docs_only != 'true'
        run: pnpm security:licenses
      # Fails on a high or critical advisory in a production dependency.
      - name: Audit production dependencies
        if: needs.scope.outputs.docs_only != 'true'
        run: pnpm security:audit

  # A full run splits the suite across three runners; a scoped run uses one.
  tests:
    name: Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: scope
    if: needs.scope.outputs.tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.3
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test every package, one shard
        if: needs.scope.outputs.run_all == 'true'
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: pnpm exec vitest run --shard="$SHARD"
      - name: Test the affected packages
        if: needs.scope.outputs.run_all != 'true' && needs.scope.outputs.packages != ''
        env:
          PACKAGES: ${{ needs.scope.outputs.packages }}
        # Word splitting is intended: PACKAGES is a space-separated list of package folders.
        run: pnpm exec vitest run --passWithNoTests $PACKAGES
      - name: Test the release and CI tooling
        if: matrix.shard == 1
        run: pnpm test:release

  # Static analysis of the code and the workflows. Fails on any CodeQL error-level result, and
  # uploads the results to code scanning so they show on the pull request.
  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
      - name: Fail on error-level results
        run: node scripts/codeql-gate.mjs codeql-results

  # Audits the workflows for unsafe patterns: template injection, credential persistence,
  # over-broad permissions and unpinned actions.
  workflow-audit:
    name: Workflow audit
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        run: pipx run zizmor==1.31.1 --offline --min-severity medium --format github .github/workflows

  # Builds each server image as the deploy does and scans it with Trivy. Fails on a high or
  # critical vulnerability that has a fix, and keeps an SPDX SBOM of each image for 30 days.
  image-scan:
    name: Image scan (${{ matrix.image.name }})
    needs: scope
    if: needs.scope.outputs.self_hosted == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api, dockerfile: apps/api/Dockerfile }
          - { name: worker, dockerfile: apps/worker/Dockerfile }
          - { name: page-fetcher, dockerfile: apps/page-fetcher/Dockerfile }
          - { name: keycloak, dockerfile: deploy/keycloak/Dockerfile }
    env:
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
      IMAGE: draft-loop-${{ matrix.image.name }}:scan
      DOCKERFILE: ${{ matrix.image.dockerfile }}
      NAME: ${{ matrix.image.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --file "$DOCKERFILE" --tag "$IMAGE" .
      - name: Install Trivy
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" trivy
      - name: Scan for fixable high and critical vulnerabilities
        run: |
          ./trivy image --skip-version-check --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 "$IMAGE"
      - name: Write the SBOM
        if: success() || failure()
        run: ./trivy image --skip-version-check --format spdx-json --output "sbom-$NAME.spdx.json" "$IMAGE"
      - name: Keep the SBOM
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image.name }}
          path: sbom-${{ matrix.image.name }}.spdx.json
          retention-days: 30

  # The required check. It always reports, so a job skipped by scope never blocks a merge.
  validate:
    name: validate
    needs: [scope, static-checks, tests, server-storage, codeql, workflow-audit, image-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job the change needs to pass
        env:
          SCOPE: ${{ needs.scope.result }}
          STATIC: ${{ needs.static-checks.result }}
          TESTS: ${{ needs.tests.result }}
          TESTS_NEEDED: ${{ needs.scope.outputs.tests }}
          STORAGE: ${{ needs.server-storage.result }}
          STORAGE_NEEDED: ${{ needs.scope.outputs.server_storage }}
          CODEQL: ${{ needs.codeql.result }}
          CODEQL_NEEDED: ${{ needs.scope.outputs.docs_only != 'true' }}
          WORKFLOWS: ${{ needs.workflow-audit.result }}
          IMAGES: ${{ needs.image-scan.result }}
          IMAGES_NEEDED: ${{ needs.scope.outputs.self_hosted }}
        run: |
          check() {
            if [ "$2" = true ]; then want=success; else want=skipped; fi
            if [ "$3" != "$want" ]; then
              echo "::error::$1 ended $3; this change needs it to be $want."
              exit 1
            fi
            echo "$1: $3"
          }
          check "Change scope" true "$SCOPE"
          check "Static checks" true "$STATIC"
          check "Tests" "$TESTS_NEEDED" "$TESTS"
          check "Server storage" "$STORAGE_NEEDED" "$STORAGE"
          check "CodeQL" "$CODEQL_NEEDED" "$CODEQL"
          check "Workflow audit" true "$WORKFLOWS"
          check "Image scan" "$IMAGES_NEEDED" "$IMAGES"

  server-storage:
    name: Server storage
    needs: scope
    if: needs.scope.outputs.server_storage == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DRAFT_LOOP_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      DRAFT_LOOP_TEST_GCS_URL: http://localhost:4443
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.3
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # A service container cannot take arguments, and the emulator needs them to serve plain HTTP.
      - name: Start the Cloud Storage emulator
        run: |
          docker run --detach --name gcs-emulator --publish 4443:4443 \
            fsouza/fake-gcs-server:1.56.1 -scheme http -port 4443 -backend memory
          for attempt in $(seq 1 30); do
            curl --silent --fail "$DRAFT_LOOP_TEST_GCS_URL/storage/v1/b?project=ci" && exit 0
            sleep 1
          done
          docker logs gcs-emulator
          exit 1
      - name: Run the storage conformance, run queue and worker suites against Postgres
        run: pnpm test:postgres
      - name: Run the blob conformance suite against the Cloud Storage emulator
        run: pnpm test:gcs

  # Not required yet (#2053): it becomes a required check once it has stayed green for a while.
  self-hosted-stack:
    name: Self-hosted stack
    needs: scope
    if: needs.scope.outputs.self_hosted == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.3
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Builds the three images from this commit, boots deploy/local with the worker on its offline
      # fixtures and runs the hosted smoke through the API, then removes the stack.
      - name: Boot the self-hosted stack and run a scripted run to a DOCX
        run: pnpm self-hosted:test
