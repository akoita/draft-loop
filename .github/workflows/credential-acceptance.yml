name: Credential acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Desktop change scope
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.scope.outputs.desktop }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Decide whether the change reaches the packaged app
        id: scope
        run: node scripts/desktop-ci-scope.mjs >> "$GITHUB_OUTPUT"

  packaged-credential-lifecycle:
    name: ${{ matrix.name }} packaged credential lifecycle
    needs: scope
    if: needs.scope.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            arch: x64
          - name: macos-arm64
            os: macos-15
            arch: arm64
          - name: windows-x64
            os: windows-latest
            arch: x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update apt package indexes (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Install Xvfb and xauth (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install --no-install-recommends -y xvfb xauth

      - name: Package desktop application
        run: pnpm --filter @draft-loop/desktop package --arch ${{ matrix.arch }}

      - name: Locate packaged executable
        id: executable
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) path="$(find apps/desktop/out -type f -name '@draft-loop-desktop' -perm -u+x -print -quit)" ;;
            macOS) path="$(find apps/desktop/out -type f -path '*.app/Contents/MacOS/*' -print -quit)" ;;
            Windows) path="$(find apps/desktop/out -type f -name '@draft-loop-desktop.exe' -print -quit)" ;;
          esac
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Run two-launch credential lifecycle acceptance (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run --auto-servernum pnpm desktop:credential-acceptance -- "${{ steps.executable.outputs.path }}" "credential-evidence/${{ matrix.name }}.json"

      - name: Run two-launch credential lifecycle acceptance (macOS and Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: pnpm desktop:credential-acceptance -- "${{ steps.executable.outputs.path }}" "credential-evidence/${{ matrix.name }}.json"

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v7
        with:
          name: credential-acceptance-${{ matrix.name }}
          path: credential-evidence/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 14

  gate:
    name: Credential acceptance gate
    needs: [scope, packaged-credential-lifecycle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every in-scope platform to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DESKTOP: ${{ needs.scope.outputs.desktop }}
          PLATFORM_RESULT: ${{ needs.packaged-credential-lifecycle.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$DESKTOP" = true ]; then
            test "$PLATFORM_RESULT" = success
          else
            echo "Only documentation or tests changed; desktop acceptance skipped."
          fi
