name: Desktop client acceptance

# Packages the desktop client (ADR 0011, D9) on each platform and drives it against a scripted
# fake API on the runner. Not a required check until the v0.8 desktop is retired.
on:
  pull_request:
    paths:
      - "apps/desktop-client/**"
      - "scripts/desktop-client-acceptance.mjs"
      - ".github/workflows/desktop-client-acceptance.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-client:
    name: ${{ matrix.name }} desktop client acceptance
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            arch: x64
          - name: macos-arm64
            os: macos-15
            arch: arm64
          - name: windows-x64
            os: windows-latest
            arch: x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Xvfb and xauth (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth

      - name: Package the desktop client
        run: pnpm --filter @draft-loop/desktop-client package --arch ${{ matrix.arch }}

      - name: Locate packaged executable
        id: executable
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) path="$(find apps/desktop-client/out -type f -name 'draftloop' -perm -u+x -print -quit)" ;;
            macOS) path="$(find apps/desktop-client/out -type f -path '*.app/Contents/MacOS/*' -print -quit)" ;;
            Windows) path="$(find apps/desktop-client/out -type f -name 'draftloop.exe' -print -quit)" ;;
          esac
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Run packaged acceptance (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run --auto-servernum pnpm desktop-client:acceptance -- "${{ steps.executable.outputs.path }}" "acceptance-evidence/${{ matrix.name }}.json"

      - name: Run packaged acceptance (macOS and Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: pnpm desktop-client:acceptance -- "${{ steps.executable.outputs.path }}" "acceptance-evidence/${{ matrix.name }}.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-client-acceptance-${{ matrix.name }}
          path: acceptance-evidence/${{ matrix.name }}.json
          if-no-files-found: warn
          retention-days: 14
