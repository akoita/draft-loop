<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">DraftLoop</title>
  <desc id="desc">DraftLoop turns your own sources into a job-specific CV. One AI drafts, an independent AI critiques, and you approve the result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1319"/>
      <stop offset="1" stop-color="#141b24"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.12" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2fd0b8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2fd0b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="0.86" cy="0.85" r="0.4">
      <stop offset="0" stop-color="#f0b53c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f0b53c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2e3742"/>
    </pattern>
    <marker id="headTeal" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.8" markerHeight="2.8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2fd0b8"/>
    </marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.8" markerHeight="2.8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0b53c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#dots)" opacity="0.6"/>
  <rect width="1200" height="400" rx="24" fill="url(#glowTeal)"/>
  <rect width="1200" height="400" rx="24" fill="url(#glowAmber)"/>

  <!-- Logo mark: a draft held inside an author (teal) and critic (amber) loop -->
  <g transform="translate(150 200)">
    <circle r="92" fill="#161a21" stroke="#232a33" stroke-width="2"/>
    <path d="M -69.9 -12.3 A 71 71 0 0 1 69.9 -12.3" fill="none" stroke="#2fd0b8" stroke-width="10" stroke-linecap="round" marker-end="url(#headTeal)"/>
    <path d="M 69.9 12.3 A 71 71 0 0 1 -69.9 12.3" fill="none" stroke="#f0b53c" stroke-width="10" stroke-linecap="round" marker-end="url(#headAmber)"/>
    <g transform="translate(-26 -34)">
      <path d="M0 6 a6 6 0 0 1 6 -6 h30 l16 16 v46 a6 6 0 0 1 -6 6 h-40 a6 6 0 0 1 -6 -6 z" fill="#fbfaf7"/>
      <path d="M36 0 v10 a6 6 0 0 0 6 6 h10" fill="#e2dfd8"/>
      <rect x="9" y="22" width="26" height="4" rx="2" fill="#16181c"/>
      <rect x="9" y="32" width="34" height="4" rx="2" fill="#0f6b5f"/>
      <rect x="9" y="42" width="30" height="4" rx="2" fill="#c4c9cf"/>
      <rect x="9" y="52" width="20" height="4" rx="2" fill="#c4c9cf"/>
    </g>
    <circle cx="26" cy="30" r="14" fill="#2fd0b8" stroke="#161a21" stroke-width="4"/>
    <path d="M19 30 l5 5 l9 -10" fill="none" stroke="#05231e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark and promise -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="282" y="168" font-size="76" font-weight="800" letter-spacing="-2" fill="#f2fbf8">Draft<tspan fill="#2fd0b8">Loop</tspan></text>
    <text x="285" y="214" font-size="24" font-weight="600" fill="#e6ebf0">Job-specific CVs, grounded in your own evidence.</text>
    <text x="285" y="252" font-size="21" fill="#9aa7b4"><tspan fill="#6ae3cf" font-weight="700">One AI drafts.</tspan> <tspan fill="#f0b53c" font-weight="700">Another critiques.</tspan> <tspan fill="#f2fbf8" font-weight="700">You decide.</tspan></text>

    <g font-size="16" font-weight="600">
      <rect x="285" y="284" width="122" height="36" rx="18" fill="#05231e" stroke="#0c7261"/>
      <circle cx="306" cy="302" r="5" fill="#2fd0b8"/>
      <text x="318" y="308" fill="#6ae3cf">Local-first</text>
      <rect x="419" y="284" width="226" height="36" rx="18" fill="#261c08" stroke="#7f5205"/>
      <circle cx="440" cy="302" r="5" fill="#f0b53c"/>
      <text x="452" y="308" fill="#f0b53c">Cross-company critique</text>
      <rect x="657" y="284" width="200" height="36" rx="18" fill="#1d232c" stroke="#3b4652"/>
      <circle cx="678" cy="302" r="5" fill="#f2fbf8"/>
      <text x="690" y="308" fill="#e6ebf0">You approve export</text>
    </g>
  </g>

  <!-- Product vignette: a CV whose claims point back to evidence -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <g transform="translate(940 44) rotate(3)" filter="url(#shadow)">
      <rect width="230" height="300" rx="12" fill="#fbfaf7"/>
      <rect x="22" y="26" width="110" height="12" rx="6" fill="#16181c"/>
      <rect x="22" y="46" width="76" height="8" rx="4" fill="#9aa1aa"/>
      <rect x="22" y="72" width="186" height="2" fill="#e2dfd8"/>
      <rect x="22" y="90" width="64" height="8" rx="4" fill="#0f6b5f"/>
      <rect x="16" y="106" width="198" height="26" rx="6" fill="#d6f2ec"/>
      <rect x="24" y="115" width="150" height="8" rx="4" fill="#0f6b5f"/>
      <rect x="22" y="142" width="170" height="8" rx="4" fill="#c4c9cf"/>
      <rect x="22" y="158" width="140" height="8" rx="4" fill="#c4c9cf"/>
      <rect x="16" y="174" width="198" height="26" rx="6" fill="#fbecd0"/>
      <rect x="24" y="183" width="120" height="8" rx="4" fill="#96650b"/>
      <path d="M24 187 h120" stroke="#8f4046" stroke-width="2"/>
      <rect x="22" y="212" width="64" height="8" rx="4" fill="#0f6b5f"/>
      <rect x="22" y="232" width="180" height="8" rx="4" fill="#c4c9cf"/>
      <rect x="22" y="248" width="156" height="8" rx="4" fill="#c4c9cf"/>
      <rect x="22" y="264" width="120" height="8" rx="4" fill="#c4c9cf"/>
    </g>

    <!-- Evidence link -->
    <path d="M 1146 175 C 1176 165, 1180 130, 1160 112" fill="none" stroke="#2fd0b8" stroke-width="2.5" stroke-dasharray="5 5"/>
    <g transform="translate(985 78)">
      <rect width="190" height="34" rx="9" fill="#05231e" stroke="#2fd0b8"/>
      <text x="14" y="22" font-size="14" font-weight="700" fill="#6ae3cf">↳ evidence</text>
      <text x="96" y="22" font-size="14" fill="#c9d3dc">notes.md</text>
    </g>

    <!-- Critic finding -->
    <path d="M 946 238 C 904 240, 890 280, 904 318" fill="none" stroke="#f0b53c" stroke-width="2.5" stroke-dasharray="5 5"/>
    <g transform="translate(872 318)">
      <rect width="214" height="58" rx="10" fill="#261c08" stroke="#f0b53c"/>
      <text x="14" y="24" font-size="14" font-weight="700" fill="#f0b53c">Critic finding</text>
      <text x="14" y="44" font-size="14" fill="#e6ebf0">Metric not in sources</text>
    </g>

    <!-- Approval badge -->
    <g transform="translate(1132 330)">
      <circle r="30" fill="#2fd0b8" stroke="#0f1319" stroke-width="6"/>
      <path d="M-12 0 l8 8 l16 -18" fill="none" stroke="#05231e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
