<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Redakloop hosted service architecture (as built)</title>
  <desc id="desc">The hosted service as it runs in November 2026, from ADR 0011. The web screen with the public pages, AI agents through draftloop-mcp reach a Fastify API on Cloud Run in Google Cloud europe-west1. The API also serves the operator screen, runs intake screening and the support assistant, and signs people in through a self-hosted Keycloak on Cloud Run that scales to zero, with a passkey or one-time code as second factor where required. It queues run ids for the worker, a Cloud Run job that a scheduler sweep also starts, which drafts and reviews through the model gateway. The gateway sends only approved context to the Anthropic author on Vertex AI in the EU, with a recorded fallback, and to the OpenAI critic, which can switch once to a recorded fallback critic. Data lives in Cloud SQL Postgres with pgvector, row-level security per tenant, the run queue, backups and point-in-time recovery, and in Cloud Storage with a customer-managed key. The page fetcher is the only part that reaches public job pages. Monitoring raises alerts and an uptime check. Brevo sends invites, waitlist confirmations and sign-in mail, and Stripe sells credit packs. A separate operator app, a load balancer with Cloud Armor and Business single sign-on are planned. On your machine, the self-hosted server runs the same images with Docker Compose, the Electron desktop client is a window over that server, and the CLI imports old desktop workspaces.</desc>
