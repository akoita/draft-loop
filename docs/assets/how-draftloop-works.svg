<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">How DraftLoop works</title>
  <desc id="desc">Inside a local workspace, the job description and candidate sources pass a visible transmission approval, then a grounded author drafts and an independent critic evaluates in bounded rounds. Anthropic is the default author and OpenAI the default critic; each receives only approved context. The candidate reviews every claim and exports the CV locally.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1319"/>
      <stop offset="1" stop-color="#141b24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.38">
      <stop offset="0" stop-color="#2fd0b8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2fd0b8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#232a33"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f7d8e"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2fd0b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0b53c"/>
    </marker>
  </defs>

  <rect width="1200" height="700" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="700" rx="24" fill="url(#dots)"/>
  <rect width="1200" height="700" rx="24" fill="url(#glow)"/>

  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- Header -->
    <text x="40" y="54" font-size="14" font-weight="700" letter-spacing="2.5" fill="#f0b53c">HOW DRAFTLOOP WORKS</text>
    <text x="40" y="88" font-size="26" font-weight="700" fill="#f2fbf8">An evidence-grounded author–critic loop that runs on your machine</text>

    <!-- Model providers, outside the local boundary -->
    <g>
      <rect x="300" y="118" width="260" height="70" rx="14" fill="#161a21" stroke="#2fd0b8" stroke-width="1.5"/>
      <circle cx="334" cy="153" r="16" fill="#05231e" stroke="#2fd0b8"/>
      <text x="334" y="159" font-size="16" font-weight="800" fill="#6ae3cf" text-anchor="middle">A</text>
      <text x="362" y="148" font-size="17" font-weight="700" fill="#f2fbf8">Anthropic</text>
      <text x="362" y="170" font-size="15" fill="#9aa7b4">default author model</text>

      <rect x="640" y="118" width="260" height="70" rx="14" fill="#161a21" stroke="#f0b53c" stroke-width="1.5"/>
      <circle cx="674" cy="153" r="16" fill="#261c08" stroke="#f0b53c"/>
      <text x="674" y="159" font-size="16" font-weight="800" fill="#f0b53c" text-anchor="middle">O</text>
      <text x="702" y="148" font-size="17" font-weight="700" fill="#f2fbf8">OpenAI</text>
      <text x="702" y="170" font-size="15" fill="#9aa7b4">default critic model</text>

      <text x="600" y="162" font-size="26" font-weight="700" fill="#6f7d8e" text-anchor="middle">≠</text>
      <text x="1160" y="148" font-size="15" font-weight="600" fill="#9aa7b4" text-anchor="end">Different companies</text>
      <text x="1160" y="170" font-size="15" fill="#6f7d8e" text-anchor="end">by default</text>
    </g>

    <!-- Provider connections: only approved context crosses the boundary -->
    <path d="M430 188 V 234 M430 264 V 380" stroke="#2fd0b8" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
    <path d="M770 188 V 380" stroke="#f0b53c" stroke-width="2" stroke-dasharray="6 6" fill="none"/>

    <!-- Local workspace boundary -->
    <rect x="30" y="222" width="1140" height="392" rx="20" fill="#11151b" fill-opacity="0.75" stroke="#2fd0b8" stroke-width="1.5" stroke-dasharray="10 8"/>
    <g transform="translate(56 240)">
      <rect x="0" y="4" width="16" height="12" rx="2" fill="#2fd0b8"/>
      <path d="M3 4 v-4 a5 5 0 0 1 10 0 v4" fill="none" stroke="#2fd0b8" stroke-width="2.2"/>
      <text x="26" y="16" font-size="14" font-weight="700" letter-spacing="2" fill="#6ae3cf">LOCAL WORKSPACE</text>
      <text x="212" y="16" font-size="15" fill="#9aa7b4">· Sources, run history and exports stay on your machine</text>
    </g>

    <!-- Approval locks where the provider lines cross the boundary -->
    <g transform="translate(430 222)">
      <circle r="15" fill="#0f1319" stroke="#2fd0b8" stroke-width="1.5"/>
      <rect x="-6" y="-2" width="12" height="9" rx="1.5" fill="#2fd0b8"/>
      <path d="M-3.5 -2 v-3 a3.5 3.5 0 0 1 7 0 v3" fill="none" stroke="#2fd0b8" stroke-width="1.8"/>
    </g>
    <g transform="translate(770 222)">
      <circle r="15" fill="#0f1319" stroke="#f0b53c" stroke-width="1.5"/>
      <rect x="-6" y="-2" width="12" height="9" rx="1.5" fill="#f0b53c"/>
      <path d="M-3.5 -2 v-3 a3.5 3.5 0 0 1 7 0 v3" fill="none" stroke="#f0b53c" stroke-width="1.8"/>
    </g>
    <text x="420" y="210" font-size="14" fill="#6ae3cf" text-anchor="end">approved context only</text>
    <text x="780" y="210" font-size="14" fill="#f0b53c">approved draft + evidence only</text>

    <!-- Step headings -->
    <g font-size="17" font-weight="700" fill="#f2fbf8" text-anchor="middle">
      <circle cx="80" cy="290" r="13" fill="#232a33"/><text x="80" y="296" font-size="14" fill="#f0b53c">1</text>
      <text x="138" y="296">Collect</text>
      <circle cx="262" cy="290" r="13" fill="#232a33"/><text x="262" y="296" font-size="14" fill="#f0b53c">2</text>
      <text x="320" y="296">Approve</text>
      <circle cx="510" cy="290" r="13" fill="#232a33"/><text x="510" y="296" font-size="14" fill="#f0b53c">3</text>
      <text x="610" y="296">Draft ⇄ critique</text>
      <circle cx="862" cy="290" r="13" fill="#232a33"/><text x="862" y="296" font-size="14" fill="#f0b53c">4</text>
      <text x="920" y="296">Review</text>
      <circle cx="1032" cy="290" r="13" fill="#232a33"/><text x="1032" y="296" font-size="14" fill="#f0b53c">5</text>
      <text x="1090" y="296">Export</text>
    </g>

    <!-- 1. Sources -->
    <g>
      <g transform="translate(70 360) rotate(-8)">
        <rect width="70" height="90" rx="8" fill="#fbecd0"/>
        <rect x="12" y="16" width="40" height="7" rx="3.5" fill="#96650b"/>
        <rect x="12" y="32" width="46" height="5" rx="2.5" fill="#c9b48a"/>
        <rect x="12" y="44" width="38" height="5" rx="2.5" fill="#c9b48a"/>
        <rect x="12" y="56" width="44" height="5" rx="2.5" fill="#c9b48a"/>
      </g>
      <g transform="translate(118 362) rotate(6)">
        <rect width="70" height="90" rx="8" fill="#fbfaf7"/>
        <rect x="12" y="16" width="34" height="7" rx="3.5" fill="#0f6b5f"/>
        <rect x="12" y="32" width="46" height="5" rx="2.5" fill="#c4c9cf"/>
        <rect x="12" y="44" width="40" height="5" rx="2.5" fill="#c4c9cf"/>
        <rect x="12" y="56" width="44" height="5" rx="2.5" fill="#c4c9cf"/>
        <rect x="12" y="68" width="30" height="5" rx="2.5" fill="#c4c9cf"/>
      </g>
      <text x="125" y="500" font-size="15" font-weight="600" fill="#e6ebf0" text-anchor="middle">Job description</text>
      <text x="125" y="521" font-size="15" fill="#9aa7b4" text-anchor="middle">+ your CV, notes</text>
      <text x="125" y="542" font-size="15" fill="#9aa7b4" text-anchor="middle">and projects</text>
    </g>

    <path d="M200 418 H 240" stroke="#6f7d8e" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 2. Approval gate -->
    <g transform="translate(296 368)">
      <path d="M0 0 L44 -14 L88 0 V 40 C 88 72, 60 90, 44 98 C 28 90, 0 72, 0 40 Z" fill="#161a21" stroke="#2fd0b8" stroke-width="2.5"/>
      <path d="M26 44 l13 13 l24 -26" fill="none" stroke="#2fd0b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="340" y="500" font-size="15" font-weight="600" fill="#e6ebf0" text-anchor="middle">You choose what</text>
    <text x="340" y="521" font-size="15" fill="#9aa7b4" text-anchor="middle">each provider sees:</text>
    <text x="340" y="542" font-size="15" fill="#9aa7b4" text-anchor="middle">model, scope, retention</text>

    <path d="M392 418 H 404" stroke="#6f7d8e" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 3. The loop -->
    <path d="M500 380 C 540 316, 660 316, 700 380" fill="none" stroke="#2fd0b8" stroke-width="3" marker-end="url(#arrowTeal)"/>
    <text x="600" y="320" font-size="14" font-weight="600" fill="#6ae3cf" text-anchor="middle">draft + evidence links</text>
    <path d="M700 460 C 660 528, 540 528, 500 460" fill="none" stroke="#f0b53c" stroke-width="3" marker-end="url(#arrowAmber)"/>
    <text x="600" y="540" font-size="14" font-weight="600" fill="#f0b53c" text-anchor="middle">rubric findings → bounded revision</text>

    <g>
      <rect x="408" y="380" width="164" height="80" rx="14" fill="#05231e" stroke="#2fd0b8" stroke-width="2"/>
      <text x="490" y="413" font-size="17" font-weight="700" fill="#f2fbf8" text-anchor="middle">Grounded author</text>
      <text x="490" y="437" font-size="14" fill="#6ae3cf" text-anchor="middle">claims cite sources</text>
    </g>
    <g>
      <rect x="628" y="380" width="164" height="80" rx="14" fill="#261c08" stroke="#f0b53c" stroke-width="2"/>
      <text x="710" y="413" font-size="17" font-weight="700" fill="#f2fbf8" text-anchor="middle">Independent critic</text>
      <text x="710" y="437" font-size="14" fill="#f0b53c" text-anchor="middle">scores against rubric</text>
    </g>
    <text x="600" y="576" font-size="14" fill="#9aa7b4" text-anchor="middle">Stops when stable, on budget, or when you review early</text>

    <path d="M796 418 H 826" stroke="#6f7d8e" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 4. Human review -->
    <g transform="translate(870 362)">
      <rect width="100" height="96" rx="12" fill="#161a21" stroke="#3b4652" stroke-width="1.5"/>
      <g fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 22 l6 6 l10 -12" stroke="#2fd0b8"/>
        <path d="M14 50 l6 6 l10 -12" stroke="#2fd0b8"/>
        <path d="M16 72 l12 12 M28 72 l-12 12" stroke="#ef5350"/>
      </g>
      <rect x="40" y="20" width="46" height="6" rx="3" fill="#c4c9cf"/>
      <rect x="40" y="48" width="38" height="6" rx="3" fill="#c4c9cf"/>
      <rect x="40" y="76" width="42" height="6" rx="3" fill="#6f7d8e"/>
    </g>
    <text x="920" y="500" font-size="15" font-weight="600" fill="#e6ebf0" text-anchor="middle">You accept, edit</text>
    <text x="920" y="521" font-size="15" fill="#9aa7b4" text-anchor="middle">or reject every</text>
    <text x="920" y="542" font-size="15" fill="#9aa7b4" text-anchor="middle">claim</text>

    <path d="M982 418 H 1012" stroke="#6f7d8e" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 5. Local export -->
    <g transform="translate(1052 360)">
      <rect width="76" height="98" rx="8" fill="#fbfaf7"/>
      <rect x="12" y="16" width="44" height="8" rx="4" fill="#16181c"/>
      <rect x="12" y="32" width="52" height="5" rx="2.5" fill="#c4c9cf"/>
      <rect x="12" y="44" width="46" height="5" rx="2.5" fill="#c4c9cf"/>
      <rect x="12" y="56" width="50" height="5" rx="2.5" fill="#c4c9cf"/>
      <circle cx="66" cy="86" r="17" fill="#2fd0b8" stroke="#11151b" stroke-width="4"/>
      <path d="M58 86 l6 6 l10 -11" fill="none" stroke="#05231e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1090" y="500" font-size="15" font-weight="600" fill="#e6ebf0" text-anchor="middle">Saved locally</text>
    <text x="1090" y="521" font-size="15" fill="#9aa7b4" text-anchor="middle">Markdown, PDF</text>
    <text x="1090" y="542" font-size="15" fill="#9aa7b4" text-anchor="middle">or DOCX</text>

    <!-- Guarantees -->
    <g font-size="15" font-weight="600">
      <rect x="30" y="634" width="364" height="40" rx="20" fill="#05231e" stroke="#0c7261"/>
      <circle cx="54" cy="654" r="5" fill="#2fd0b8"/>
      <text x="68" y="659" fill="#6ae3cf">Every claim links back to your evidence</text>
      <rect x="418" y="634" width="364" height="40" rx="20" fill="#261c08" stroke="#7f5205"/>
      <circle cx="442" cy="654" r="5" fill="#f0b53c"/>
      <text x="456" y="659" fill="#f0b53c">Provider and model recorded for each run</text>
      <rect x="806" y="634" width="364" height="40" rx="20" fill="#1d232c" stroke="#3b4652"/>
      <circle cx="830" cy="654" r="5" fill="#f2fbf8"/>
      <text x="844" y="659" fill="#e6ebf0">Nothing exported without your approval</text>
    </g>
  </g>
</svg>
