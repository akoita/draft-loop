<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1010" viewBox="0 0 1240 1010" role="img" aria-labelledby="title desc">
<title id="title">DraftLoop system boundaries</title>
<desc id="desc">The candidate uses the CLI or the desktop app. In the desktop, the React renderer sends typed commands through a frozen, allowlisted preload bridge over a single IPC channel to the Electron main host. CLI and host call shared application contracts, which drive the orchestrator and ingestion. The orchestrator coordinates domain and schemas, validation and evaluations, artifacts and rendering, and provider adapters. Application, domain and ingestion persist to the SQLite workspace store; explicit CKB commands reach the portable CKB store, which serves exact selected source-version lexical retrieval to ingestion. The host owns the credential store, which provides key lookup to provider adapters and is never projected back. External boundaries: provider adapters send only approved transmissions to Anthropic, OpenAI or a local compatible endpoint; the host makes validated URL fetch requests whose results go to ingestion; approved local files or bounded directories enter through the application; and only approved artifacts are exported locally as Markdown, DOCX or PDF.</desc>
