<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-grounded evaluator–optimizer loop</title>
  <desc id="desc">Canonical inputs feed the author, which drafts a structured artifact with evidence links. An independent evaluator and deterministic checks score the artifact against a visible rubric of factuality, evidence support, requirement coverage, and quality. Accepted findings drive a bounded revision back to the author. The loop stops when quality is stable, the budget is exhausted, or the user reviews early; human approval then allows local export.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1319"/>
      <stop offset="1" stop-color="#141b24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.48" r="0.3">
      <stop offset="0" stop-color="#2fd0b8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2fd0b8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#232a33"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f7d8e"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2fd0b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0b53c"/>
    </marker>
  </defs>

  <rect width="1200" height="660" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="660" rx="24" fill="url(#dots)"/>
  <rect width="1200" height="660" rx="24" fill="url(#glow)"/>

  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="40" y="54" font-size="14" font-weight="700" letter-spacing="2.5" fill="#f0b53c">EVALUATOR–OPTIMIZER</text>
    <text x="40" y="88" font-size="26" font-weight="700" fill="#f2fbf8">Each round is a bounded optimization step against a visible rubric</text>

    <!-- Canonical inputs -->
    <rect x="40" y="150" width="220" height="334" rx="16" fill="#161a21" stroke="#3b4652"/>
    <text x="60" y="182" font-size="17" font-weight="700" fill="#f2fbf8">Canonical inputs</text>
    <g transform="translate(60 204)">
      <rect width="180" height="60" rx="10" fill="#261c08" stroke="#7f5205"/>
      <text x="14" y="26" font-size="15" font-weight="700" fill="#f0b53c">Job requirements</text>
      <text x="14" y="46" font-size="13" fill="#c9b48a">approved and prioritized</text>
    </g>
    <g transform="translate(60 276)">
      <rect width="180" height="60" rx="10" fill="#05231e" stroke="#0c7261"/>
      <text x="14" y="26" font-size="15" font-weight="700" fill="#6ae3cf">Selected evidence</text>
      <text x="14" y="46" font-size="13" fill="#9fd9cd">exact source versions</text>
    </g>
    <g transform="translate(60 348)">
      <rect width="180" height="60" rx="10" fill="#1d232c" stroke="#3b4652"/>
      <text x="14" y="26" font-size="15" font-weight="700" fill="#e6ebf0">Candidate profile</text>
      <text x="14" y="46" font-size="13" fill="#9aa7b4">+ writing policy</text>
    </g>
    <text x="60" y="446" font-size="13" fill="#9aa7b4">Immutable context snapshot</text>
    <text x="60" y="465" font-size="13" fill="#9aa7b4">recorded with each run</text>
    <path d="M262 192 H 296" stroke="#6f7d8e" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Loop nodes -->
    <rect x="300" y="150" width="210" height="84" rx="14" fill="#05231e" stroke="#2fd0b8" stroke-width="2"/>
    <text x="320" y="182" font-size="17" font-weight="700" fill="#f2fbf8">Author draft</text>
    <text x="320" y="206" font-size="14" fill="#6ae3cf">generator · cites evidence</text>
    <text x="490" y="224" font-size="12" font-weight="700" letter-spacing="1" fill="#2fd0b8" text-anchor="end">ANTHROPIC</text>

    <rect x="690" y="150" width="210" height="84" rx="14" fill="#fbfaf7"/>
    <rect x="706" y="166" width="6" height="52" rx="3" fill="#0f6b5f"/>
    <text x="724" y="182" font-size="17" font-weight="700" fill="#16181c">Structured artifact</text>
    <text x="724" y="206" font-size="14" fill="#0f6b5f">claims + evidence links</text>

    <rect x="690" y="400" width="210" height="84" rx="14" fill="#261c08" stroke="#f0b53c" stroke-width="2"/>
    <text x="710" y="432" font-size="17" font-weight="700" fill="#f2fbf8">Independent critic</text>
    <text x="710" y="456" font-size="14" fill="#f0b53c">+ deterministic checks</text>
    <text x="880" y="474" font-size="12" font-weight="700" letter-spacing="1" fill="#f0b53c" text-anchor="end">OPENAI</text>

    <rect x="300" y="400" width="210" height="84" rx="14" fill="#161a21" stroke="#6ae3cf" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="320" y="432" font-size="17" font-weight="700" fill="#f2fbf8">Bounded revision</text>
    <text x="320" y="456" font-size="14" fill="#9aa7b4">accepted findings only</text>

    <!-- Loop edges -->
    <path d="M514 192 H 684" stroke="#2fd0b8" stroke-width="3" marker-end="url(#arrowTeal)"/>
    <text x="600" y="180" font-size="14" font-weight="600" fill="#6ae3cf" text-anchor="middle">draft</text>
    <path d="M795 238 V 394" stroke="#f0b53c" stroke-width="3" marker-end="url(#arrowAmber)"/>
    <text x="808" y="322" font-size="14" font-weight="600" fill="#f0b53c">evaluate</text>
    <path d="M686 442 H 516" stroke="#f0b53c" stroke-width="3" marker-end="url(#arrowAmber)"/>
    <text x="600" y="430" font-size="14" font-weight="600" fill="#f0b53c" text-anchor="middle">findings</text>
    <path d="M405 396 V 240" stroke="#2fd0b8" stroke-width="3" marker-end="url(#arrowTeal)"/>
    <text x="392" y="322" font-size="14" font-weight="600" fill="#6ae3cf" text-anchor="end">revise</text>

    <!-- Loop centre -->
    <g transform="translate(600 317)">
      <circle r="58" fill="#11151b" stroke="#2e3742" stroke-width="1.5"/>
      <path d="M -34 -12 A 36 36 0 0 1 34 -12" fill="none" stroke="#2fd0b8" stroke-width="5" stroke-linecap="round"/>
      <path d="M 34 12 A 36 36 0 0 1 -34 12" fill="none" stroke="#f0b53c" stroke-width="5" stroke-linecap="round"/>
      <text y="-1" font-size="14" font-weight="700" fill="#f2fbf8" text-anchor="middle">round n</text>
      <text y="17" font-size="12" fill="#9aa7b4" text-anchor="middle">bounded</text>
    </g>

    <!-- Rubric -->
    <rect x="940" y="150" width="220" height="250" rx="16" fill="#161a21" stroke="#3b4652"/>
    <text x="960" y="182" font-size="17" font-weight="700" fill="#f2fbf8">Visible rubric</text>
    <g font-size="15" fill="#e6ebf0">
      <rect x="956" y="200" width="190" height="36" rx="8" fill="#1d232c"/>
      <circle cx="978" cy="218" r="5" fill="#f0b53c"/><text x="992" y="223">Factuality</text>
      <rect x="956" y="244" width="190" height="36" rx="8" fill="#1d232c"/>
      <circle cx="978" cy="262" r="5" fill="#f0b53c"/><text x="992" y="267">Evidence support</text>
      <rect x="956" y="288" width="190" height="36" rx="8" fill="#1d232c"/>
      <circle cx="978" cy="306" r="5" fill="#f0b53c"/><text x="990" y="311" font-size="14">Requirement coverage</text>
      <rect x="956" y="332" width="190" height="36" rx="8" fill="#1d232c"/>
      <circle cx="978" cy="350" r="5" fill="#f0b53c"/><text x="992" y="355">Quality</text>
    </g>
    <path d="M1050 402 C 1050 440, 960 442, 906 442" fill="none" stroke="#f0b53c" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowAmber)"/>

    <!-- Exit -->
    <path d="M795 488 V 528" stroke="#6f7d8e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="690" y="532" width="210" height="88" rx="14" fill="#1d232c" stroke="#3b4652"/>
    <text x="710" y="562" font-size="16" font-weight="700" fill="#f2fbf8">Stop when</text>
    <text x="710" y="584" font-size="14" fill="#9aa7b4">stable · budget exhausted</text>
    <text x="710" y="604" font-size="14" fill="#9aa7b4">· you review early</text>

    <path d="M904 576 H 934" stroke="#6f7d8e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="940" y="532" width="220" height="88" rx="14" fill="#05231e" stroke="#2fd0b8" stroke-width="2"/>
    <circle cx="972" cy="576" r="16" fill="#2fd0b8"/>
    <path d="M964 576 l6 6 l10 -12" fill="none" stroke="#05231e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1000" y="568" font-size="16" font-weight="700" fill="#f2fbf8">Human approval</text>
    <text x="1000" y="592" font-size="14" fill="#6ae3cf">→ local export</text>

    <!-- Principle -->
    <text x="300" y="540" font-size="15" font-weight="700" fill="#e6ebf0">Findings are structured and severity-rated,</text>
    <text x="300" y="562" font-size="15" fill="#9aa7b4">linked to claims, sections or sources. A critic</text>
    <text x="300" y="584" font-size="15" fill="#9aa7b4">can flag a problem but cannot establish truth;</text>
    <text x="300" y="606" font-size="15" fill="#9aa7b4">your evidence and decisions stay authoritative.</text>
  </g>
</svg>
