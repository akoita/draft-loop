<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DraftLoop client-server target architecture (planned)</title>
  <desc id="desc">Planned architecture from ADR 0011. A web app and AI agents reach a Fastify API on Cloud Run in Google Cloud europe-west1. The API queues runs for workers, which handle runs, ingestion and embeddings and call a model gateway. The gateway sends approved context to the Anthropic author on Vertex AI in the EU and the OpenAI critic in an EU data-residency project. Data lives in Cloud SQL Postgres with pgvector and per-tenant row-level security, which is already built, and in Cloud Storage. Sign-in uses Keycloak on Clever Cloud in France. Every service is built from the same packages as the desktop app. The local-first desktop app, the CLI, a planned local MCP server and the local SQLite store keep running on the user's machine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1319"/>
      <stop offset="1" stop-color="#141b24"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#232a33"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f7d8e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0b53c"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="720" rx="24" fill="url(#dots)"/>

  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="40" y="54" font-size="14" font-weight="700" letter-spacing="2.5" fill="#f0b53c">TARGET ARCHITECTURE · PLANNED</text>
    <text x="40" y="88" font-size="26" font-weight="700" fill="#f2fbf8">The same engine, hosted beside the local-first app</text>

    <!-- Legend -->
    <rect x="890" y="40" width="34" height="20" rx="5" fill="#1d232c" stroke="#2fd0b8" stroke-width="2"/>
    <text x="934" y="55" font-size="14" fill="#c6d1dc">Built on main</text>
    <rect x="1040" y="40" width="34" height="20" rx="5" fill="#1d232c" stroke="#f0b53c" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1084" y="55" font-size="14" fill="#c6d1dc">Planned</text>

    <!-- Clients -->
    <text x="40" y="148" font-size="14" font-weight="700" letter-spacing="2" fill="#9aa7b4">CLIENTS</text>
    <rect x="30" y="160" width="220" height="80" rx="12" fill="#1d232c" stroke="#f0b53c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="48" y="190" font-size="17" font-weight="700" fill="#f2fbf8">Web app</text>
    <text x="48" y="212" font-size="14" fill="#9aa7b4">Review screens shared</text>
    <text x="48" y="230" font-size="14" fill="#9aa7b4">with the desktop app</text>
    <rect x="30" y="270" width="220" height="80" rx="12" fill="#1d232c" stroke="#f0b53c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="48" y="300" font-size="17" font-weight="700" fill="#f2fbf8">AI agents</text>
    <text x="48" y="322" font-size="14" fill="#9aa7b4">Hosted MCP over the API</text>
    <text x="48" y="340" font-size="14" fill="#9aa7b4">Claude, Codex, others</text>

    <!-- Cloud boundary -->
    <rect x="275" y="118" width="630" height="432" rx="20" fill="#11151b" fill-opacity="0.75" stroke="#2fd0b8" stroke-width="1.5" stroke-dasharray="10 8"/>
    <text x="298" y="148" font-size="14" font-weight="700" letter-spacing="2" fill="#6ae3cf">GOOGLE CLOUD</text>
    <text x="440" y="148" font-size="15" fill="#9aa7b4">· europe-west1</text>

    <!-- API -->
    <rect x="300" y="160" width="260" height="80" rx="12" fill="#1d232c" stroke="#f0b53c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="318" y="190" font-size="17" font-weight="700" fill="#f2fbf8">API</text>
    <text x="318" y="212" font-size="14" fill="#9aa7b4">Fastify over ApplicationService</text>
    <text x="318" y="230" font-size="14" fill="#9aa7b4">Cloud Run · /v1</text>

    <!-- Workers -->
    <rect x="300" y="270" width="260" height="80" rx="12" fill="#1d232c" stroke="#f0b53c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="318" y="300" font-size="17" font-weight="700" fill="#f2fbf8">Workers</text>
    <text x="318" y="322" font-size="14" fill="#9aa7b4">Runs, ingestion, embeddings</text>
    <text x="318" y="340" font-size="14" fill="#9aa7b4">Postgres queue · Cloud Run</text>

    <!-- Model gateway -->
    <rect x="600" y="270" width="280" height="80" rx="12" fill="#1d232c" stroke="#f0b53c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="618" y="300" font-size="17" font-weight="700" fill="#f2fbf8">Model gateway</text>
    <text x="618" y="322" font-size="14" fill="#9aa7b4">Keys, per-tenant budgets, routes</text>
    <text x="618" y="340" font-size="14" fill="#9aa7b4">Fallbacks recorded in history</text>

    <!-- Postgres (built) -->
    <rect x="300" y="380" width="280" height="80" rx="12" fill="#1d232c" stroke="#2fd0b8" stroke-width="2"/>
    <text x="318" y="410" font-size="17" font-weight="700" fill="#f2fbf8">Postgres + pgvector</text>
    <text x="318" y="432" font-size="14" fill="#9aa7b4">Cloud SQL · per-tenant RLS</text>
    <text x="318" y="450" font-size="13" fill="#6ae3cf" font-family="'JetBrains Mono', Consolas, monospace">storage-postgres</text>

    <!-- Cloud Storage -->
    <rect x="600" y="380" width="280" height="80" rx="12" fill="#1d232c" stroke="#f0b53c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="618" y="410" font-size="17" font-weight="700" fill="#f2fbf8">Cloud Storage</text>
    <text x="618" y="432" font-size="14" fill="#9aa7b4">Uploaded sources and exports</text>
    <text x="618" y="450" font-size="14" fill="#9aa7b4">CMEK · per-tenant prefixes</text>

    <!-- Shared core -->
    <rect x="300" y="480" width="580" height="50" rx="12" fill="#18202a" stroke="#2fd0b8" stroke-width="2"/>
    <text x="318" y="510" font-size="14" fill="#c6d1dc"><tspan font-weight="700" fill="#f2fbf8">Same packages as the desktop app:</tspan> orchestrator, domain, evidence, validation</text>

    <!-- External services -->
    <text x="940" y="148" font-size="14" font-weight="700" letter-spacing="2" fill="#9aa7b4">EXTERNAL</text>
    <rect x="930" y="160" width="240" height="80" rx="12" fill="#1d232c" stroke="#f0b53c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="948" y="190" font-size="17" font-weight="700" fill="#f2fbf8">Sign-in (OIDC)</text>
    <text x="948" y="212" font-size="14" fill="#9aa7b4">Keycloak on Clever Cloud</text>
    <text x="948" y="230" font-size="14" fill="#9aa7b4">France</text>
    <rect x="930" y="262" width="240" height="70" rx="12" fill="#1d232c" stroke="#3b4652"/>
    <text x="948" y="290" font-size="17" font-weight="700" fill="#f0b53c">Anthropic author</text>
    <text x="948" y="314" font-size="14" fill="#9aa7b4">Claude on Vertex AI, EU</text>
    <rect x="930" y="352" width="240" height="70" rx="12" fill="#1d232c" stroke="#3b4652"/>
    <text x="948" y="380" font-size="17" font-weight="700" fill="#6ae3cf">OpenAI critic</text>
    <text x="948" y="404" font-size="14" fill="#9aa7b4">EU data-residency project</text>

    <!-- Arrows -->
    <g stroke="#6f7d8e" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M250 200 L296 200"/>
      <path d="M250 300 L296 228"/>
      <path d="M430 240 L430 266"/>
      <path d="M560 310 L596 310"/>
      <path d="M440 350 L440 376"/>
      <path d="M545 350 L640 376"/>
      <path d="M560 200 L926 200"/>
    </g>
    <g stroke="#f0b53c" stroke-width="2" fill="none" marker-end="url(#arrowAmber)">
      <path d="M880 297 L926 297"/>
      <path d="M880 330 L926 385"/>
    </g>
    <text x="690" y="192" font-size="13" fill="#9aa7b4">sign-in tokens</text>
    <text x="436" y="259" font-size="13" fill="#9aa7b4">queued runs</text>
    <text x="886" y="282" font-size="12" fill="#f0b53c">approved</text>

    <!-- Local machine -->
    <rect x="30" y="575" width="1140" height="120" rx="20" fill="#11151b" fill-opacity="0.75" stroke="#2fd0b8" stroke-width="1.5" stroke-dasharray="10 8"/>
    <text x="56" y="603" font-size="14" font-weight="700" letter-spacing="2" fill="#6ae3cf">YOUR MACHINE</text>
    <text x="196" y="603" font-size="15" fill="#9aa7b4">· the local-first app keeps evolving beside the hosted version</text>
    <rect x="56" y="616" width="255" height="62" rx="12" fill="#1d232c" stroke="#2fd0b8" stroke-width="2"/>
    <text x="74" y="642" font-size="17" font-weight="700" fill="#f2fbf8">Desktop app</text>
    <text x="74" y="664" font-size="14" fill="#9aa7b4">Electron · today's product</text>
    <rect x="331" y="616" width="255" height="62" rx="12" fill="#1d232c" stroke="#2fd0b8" stroke-width="2"/>
    <text x="349" y="642" font-size="17" font-weight="700" fill="#f2fbf8">CLI</text>
    <text x="349" y="664" font-size="14" fill="#9aa7b4">Source-only, same contracts</text>
    <rect x="606" y="616" width="255" height="62" rx="12" fill="#1d232c" stroke="#f0b53c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="624" y="642" font-size="17" font-weight="700" fill="#f2fbf8">Local MCP server</text>
    <text x="624" y="664" font-size="14" fill="#9aa7b4">stdio, data stays local</text>
    <rect x="881" y="616" width="263" height="62" rx="12" fill="#1d232c" stroke="#2fd0b8" stroke-width="2"/>
    <text x="899" y="642" font-size="17" font-weight="700" fill="#f2fbf8">SQLite + knowledge bases</text>
    <text x="899" y="664" font-size="14" fill="#9aa7b4">Local runs, evidence, exports</text>
  </g>
</svg>
